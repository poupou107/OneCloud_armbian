name: 稳定版
on:
  workflow_dispatch:

env:
  SCRIPT_REPO: ${{ github.repository }}
  SCRIPT_REF: ${{ github.ref_name }}
  UBOOT_REPO: poupou107/u-boot-onecloud
  UBOOT_RELEASE: latest
  UBOOT_BURNIMG: eMMC.burn.img
  ARMBIAN_REPO: armbian/build
  ARMBIAN_REF: main

permissions:
  contents: write

jobs:
  prepare:
    name: 准备
    runs-on: ubuntu-latest
    outputs:
      env: ${{ steps.get.outputs.env }}
    steps:
      - id: get
        name: Get repositories and Armbian information
        run: |
          sudo timedatectl set-timezone "Asia/Shanghai"
          TIME="$(curl https://api.github.com/repos/${SCRIPT_REPO}/actions/runs/${GITHUB_RUN_ID} | jq -r .created_at)"
          TAG="ci-$(date -d "$TIME" -u +'%Y%m%d-%H%M%S-%Z')"
          SCRIPT_SHA=$(curl https://api.github.com/repos/${SCRIPT_REPO}/commits/${SCRIPT_REF} | jq -r .sha)
          UBOOT_TAG=$(curl https://api.github.com/repos/${UBOOT_REPO}/releases/${UBOOT_RELEASE} | jq -r .tag_name)
          ARMBIAN_SHA=$(curl https://api.github.com/repos/${ARMBIAN_REPO}/commits/${ARMBIAN_REF} | jq -r .sha)
          echo "Cloning Armbian repository..."
          git clone https://github.com/armbian/os os
          ARMBIAN_VERSION=$(cat os/stable.json | jq '.version' | sed "s/\"//g")
          cat <<EOF | sed -E 's/^  //' >>$GITHUB_ENV
            TIME=$TIME
            TAG=$TAG
            SCRIPT_SHA=$SCRIPT_SHA
            UBOOT_TAG=$UBOOT_TAG
            ARMBIAN_SHA=$ARMBIAN_SHA
            ARMBIAN_VERSION=$ARMBIAN_VERSION
          EOF
          echo "env=$(cat $GITHUB_ENV | base64 -w 0)" >>$GITHUB_OUTPUT
      - name: 显示存储库信息
        run: |
          C_RESET="\e[0m"
          C_BLACK="\e[30m"
          C_RED="\e[31m"
          C_GREEN="\e[32m"
          C_YELLOW="\e[33m"
          C_BLUE="\e[34m"
          C_MAGENTA="\e[35m"
          C_CYAN="\e[36m"
          C_GRAY="\e[37m"
          echo -e "$(cat <<EOF | sed -E 's/^  //'
            TIME: ${C_GREEN}$(date -d "$TIME" +'%Y-%m-%d %H:%M:%S %Z(%:z)')${C_RESET}
            Script: ${C_BLUE}${SCRIPT_REPO}${C_RESET}@${C_MAGENTA}${SCRIPT_REF}${C_RESET}(https://github.com/${SCRIPT_REPO}/tree/${SCRIPT_REF})
                    ${C_YELLOW}${SCRIPT_SHA}${C_RESET}(https://github.com/${SCRIPT_REPO}/tree/${SCRIPT_SHA})
            U-Boot: ${C_BLUE}${UBOOT_REPO}${C_RESET}@${C_MAGENTA}${UBOOT_RELEASE}${C_RESET}(https://github.com/${UBOOT_REPO}/releases/tag/${UBOOT_RELEASE})
                    ${C_MAGENTA}${UBOOT_TAG}${C_RESET}(https://github.com/${UBOOT_REPO}/releases/tag/${UBOOT_TAG})
            Armbian: ${C_BLUE}${ARMBIAN_REPO}${C_RESET}@${C_MAGENTA}${ARMBIAN_REF}${C_RESET}(https://github.com/${ARMBIAN_REPO}/tree/${ARMBIAN_REF})
                     ${C_YELLOW}${ARMBIAN_SHA}${C_RESET}(https://github.com/${ARMBIAN_REPO}/tree/${ARMBIAN_SHA})
          EOF
          )"
          cat <<EOF | sed -E 's/^  //' >>$GITHUB_STEP_SUMMARY
            # $(date -d "$TIME" +'%Y-%m-%d %H:%M:%S %Z(%:z)')
            ## Sources
            Script: [${SCRIPT_REPO}@${SCRIPT_REF}](https://github.com/${SCRIPT_REPO}/tree/${SCRIPT_REF}) ([`${SCRIPT_SHA}`](https://github.com/${SCRIPT_REPO}/tree/${SCRIPT_SHA}))
            U-Boot: [${UBOOT_REPO}@${UBOOT_RELEASE}](https://github.com/${UBOOT_REPO}/releases/tag/${UBOOT_RELEASE}) ([`${UBOOT_TAG}`](https://github.com/${UBOOT_REPO}/releases/tag/${UBOOT_TAG}))
            Armbian: [${ARMBIAN_REPO}@${ARMBIAN_REF}](https://github.com/${ARMBIAN_REPO}/tree/${ARMBIAN_REF}) ([`${ARMBIAN_SHA}`](https://github.com/${ARMBIAN_REPO}/tree/${ARMBIAN_SHA}))
          EOF
      - name: 生成发布信息
        run: |
          cat <<EOF | sed -E 's/^  //' | tee Release.md
            稳定版 $(date -d "$TIME" +'%Y-%m-%d %H:%M:%S %Z(%:z)')
            # Sources
            Script: [${SCRIPT_REPO}@${SCRIPT_REF}](https://github.com/${SCRIPT_REPO}/tree/${SCRIPT_REF}) ([`${SCRIPT_SHA}`](https://github.com/${SCRIPT_REPO}/tree/${SCRIPT_SHA}))
            U-Boot: [${UBOOT_REPO}@${UBOOT_RELEASE}](https://github.com/${UBOOT_REPO}/releases/tag/${UBOOT_RELEASE}) ([`${UBOOT_TAG}`](https://github.com/${UBOOT_REPO}/releases/tag/${UBOOT_TAG}))
            Armbian: [${ARMBIAN_REPO}@${ARMBIAN_REF}](https://github.com/${ARMBIAN_REPO}/tree/${ARMBIAN_REF}) ([`${ARMBIAN_SHA}`](https://github.com/${ARMBIAN_REPO}/tree/${ARMBIAN_SHA}))
            # SHA256
          EOF
          echo "NAME=$(head --line=1 Release.md)" >>$GITHUB_ENV
          tail --line=+2 Release.md > Body.md
      # 预先创建【草稿Release】，全部编译完成再正式发布
      - name: 预先创建草稿Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: ${{ env.NAME }}
          body_path: Body.md
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}

  build-kernel:
    name: 编译内核(输出4个deb包)
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: 引入环境参数
        run: |
          echo "$(echo "${{ needs.prepare.outputs.env }}" | base64 -d)" >>$GITHUB_ENV
      - name: 检出armbian/build
        uses: actions/checkout@main
        with:
          repository: ${{ env.ARMBIAN_REPO }}
          ref: ${{ env.ARMBIAN_SHA }}
          path: build
      - name: 编译内核，生成dtb / headers / image / libc-dev deb
        run: |
          cd build
          sudo --preserve-env ./compile.sh kernel \
            REVISION="${{ env.ARMBIAN_VERSION }}" \
            ALLOW_ROOT=yes \
            BOARD=onecloud \
            BRANCH=current \
            EXPERT=yes
          sudo chown $(id -u):$(id -g) -R output/
      - name: 列出deb，校验产物
        run: |
          ls -la build/output/debs/
      - name: 计算sha256哈希
        run: |
          for f in build/output/debs/*.deb; do
            sha256sum "$f" | tee -a sha256-kernel.txt
          done
      - name: 上传内核deb为Artifact
        uses: actions/upload-artifact@main
        with:
          name: kernel-debs
          path: |
            build/output/debs/*.deb
            sha256-kernel.txt

  build:
    name: 编译 ${{ matrix.RELEASE }}-current-${{ matrix.TYPE }}
    needs: [ prepare, build-kernel ]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        RELEASE:
          - noble
        TYPE:
          - server
    steps:
      - name: 引入环境参数
        run: |
          echo "$(echo "${{ needs.prepare.outputs.env }}" | base64 -d)" >>$GITHUB_ENV
      - name: 检出armbian/build
        uses: actions/checkout@main
        with:
          repository: ${{ env.ARMBIAN_REPO }}
          ref: ${{ env.ARMBIAN_SHA }}
          path: build
      - name: 下载预编译内核deb(仅供镜像构建使用)
        uses: actions/download-artifact@main
        with:
          name: kernel-debs
          path: build/output/debs/
      - name: 构建armbian镜像
        run: |
          cd build
          sudo --preserve-env ./compile.sh build \
            REVISION="${{ env.ARMBIAN_VERSION }}" \
            ALLOW_ROOT=yes \
            BOARD=onecloud \
            BRANCH=current \
            RELEASE=${{ matrix.RELEASE }} \
            KERNEL_CONFIGURE=no \
            BUILD_MINIMAL=${{ matrix.TYPE == 'minimal' && 'yes' || 'no' }} \
            BUILD_DESKTOP=${{ matrix.TYPE == 'desktop' && 'yes' || 'no' }} \
            EXPERT=yes \
            COMPRESS_OUTPUTIMAGE=img
          sudo chown $(id -u):$(id -g) -R output/
      - name: 安装AmlImg工具
        run: |
          sudo apt install android-sdk-libsparse-utils
          ver="v0.3.2"
          curl -L -o ./AmlImg https://github.com/rmoyulong/AmlImg/releases/download/$ver/AmlImg_${ver}_linux_amd64
          chmod +x ./AmlImg
      - name: 下载u-boot烧录镜像
        run: |
          echo "::group::Download"
          curl -L -o ./uboot.img https://github.com/poupou107/u-boot-onecloud/releases/download/build-20260920-0146/eMMC.burn.img
          echo "::endgroup::"
          echo "::group::Unpack"
          ./AmlImg unpack ./uboot.img burn/
          echo "::endgroup::"
      - name: 提取boot与rootfs分区
        run: |
          diskimg=$(ls build/output/images/*.img)
          loop=$(sudo losetup --find --show --partscan $diskimg)
          sudo img2simg ${loop}p1 burn/boot.simg
          sudo img2simg ${loop}p2 burn/rootfs.simg
          sudo losetup -d $loop
          sudo chown $(id -u):$(id -g) -R burn/
      - name: 生成eMMC烧录镜像
        run: |
          echo -n "sha1sum $(sha1sum burn/boot.simg | awk '{print $1}')" >burn/boot.VERIFY
          echo -n "sha1sum $(sha1sum burn/rootfs.simg | awk '{print $1}')" >burn/rootfs.VERIFY
          cat <<EOF >>burn/commands.txt
          PARTITION:boot:sparse:boot.simg
          VERIFY:boot:normal:boot.VERIFY
          PARTITION:rootfs:sparse:rootfs.simg
          VERIFY:rootfs:normal:rootfs.VERIFY
          EOF
          prefix=$(ls build/output/images/*.img | sed 's/\.img$//')
          burnimg=${prefix}.burn.img
          ./AmlImg pack $burnimg burn/
      - name: 镜像哈希与压缩
        run: |
          for f in build/output/images/*.img; do
            sha256sum "$f" | tee -a sha256-image-${{ matrix.RELEASE }}-${{ matrix.TYPE }}.txt
            xz --threads=0 --compress "$f"
          done
      - name: 上传镜像Artifact
        uses: actions/upload-artifact@main
        with:
          name: ${{ matrix.RELEASE }}-current-${{ matrix.TYPE }}
          path: |
            build/output/images/*
            sha256-image-${{ matrix.RELEASE }}-${{ matrix.TYPE }}.txt

  # 【最终任务】等待全部编译完成，统一下载所有artifact，一次性上传Release
  release-final:
    name: 合并并正式发布Release
    needs: [build-kernel, build]
    runs-on: ubuntu-latest
    steps:
      - name: 引入环境参数
        run: |
          echo "$(echo "${{ needs.prepare.outputs.env }}" | base64 -d)" >>$GITHUB_ENV
      - name: 下载全部Artifacts
        uses: actions/download-artifact@main
        with:
          path: ./artifacts
      - name: 合并全部sha256校验信息
        run: |
          cat artifacts/kernel-debs/sha256-kernel.txt > full-sha256.txt
          cat artifacts/*/sha256-image-*.txt >> full-sha256.txt
          echo -e "\n## File SHA256\n\`\`\`" > body-append.md
          cat full-sha256.txt >> body-append.md
          echo -e "\`\`\`" >> body-append.md
          # 读取原有release正文，追加sha256
          gh release view ${{ env.TAG }} --json body -q .body > orig-body.md
          cat orig-body.md body-append.md > final-body.md
      - name: 列出待上传全部文件(调试用)
        run: |
          find ./artifacts -type f
      - name: 正式发布Release，包含4个内核deb + 镜像
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          body_path: final-body.md
          files: |
            artifacts/kernel-debs/*.deb
            artifacts/noble-current-server/*
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
